#
# dkms.conf — mbp-t1-touchbar
#
# Permite que los módulos apple-ibridge / apple-ib-tb / apple-ib-als se
# recompilen automáticamente cada vez que pacman actualice el kernel
# (dispara via /usr/share/libalpm/hooks/70-dkms-install.hook).
#
# Este archivo se copia junto a los .c en /usr/src/mbp-t1-touchbar-0.1/
# por install.sh durante la instalación.
#
PACKAGE_NAME="mbp-t1-touchbar"
PACKAGE_VERSION="0.1"

MAKE[0]="'make' all"
CLEAN="'make' clean"

# Tres módulos. El orden importa: apple-ibridge.ko es el multiplexer USB
# (apple-ib-tb y apple-ib-als dependen de él en código, pero aquí todos
# se cargan juntos via modules-load.d, así que el orden DKMS es libre).
BUILT_MODULE_NAME[0]="apple-ibridge"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="apple-ib-tb"
BUILT_MODULE_LOCATION[1]="."
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="apple-ib-als"
BUILT_MODULE_LOCATION[2]="."
DEST_MODULE_LOCATION[2]="/updates"

# Recompilación automática ante cambios en kernel/linux-headers.
# (Si el hook de pacman no dispara, se puede forzar con: dkms autoinstall)
AUTOINSTALL="yes"

# No toca initramfs (no es necesario: los módulos se cargan tarde, no
# durante el arranque temprano, y no se necesitan para bootear).
REMAKE_INITRD="no"
